name: Nifty Master Relative Strength

on:
  workflow_dispatch:

  schedule:
    - cron: "30 6 * * *"   # 12:00 PM IST
    - cron: "30 11 * * *"  # 5:00 PM IST
    - cron: "30 16 * * *"  # 10:00 PM IST

permissions:
  contents: write

jobs:
  calculate-rs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Nifty master RS calculation
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
        run: |
          python src/main.py


      - name: Build index and sector summary
        run: |
          python src/build_sector_summary.py


      - name: Show generated files
        run: |
          echo "Generated files:"
          ls -lh data/

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/stock_rs.csv data/stock_rs.json data/sector_summary.csv data/sector_summary.json data/errors.csv data/instrument_mapping.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Nifty master relative strength data"
            git push
          fi
